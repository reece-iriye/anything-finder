{{- if not .Values.llm.apiKeySecretRef.name }}
# Only created when no external secret ref is provided (phases 2 and 3).
# In phase 4 the key lives in a pre-existing Secret named by apiKeySecretRef.
apiVersion: v1
kind: Secret
metadata:
  name: app-secret
  labels:
    {{- include "anything-finder.labels" . | nindent 4 }}
    app.kubernetes.io/component: app
type: Opaque
stringData:
  llm-api-key: {{ .Values.llm.apiKey | quote }}
{{- end }}
