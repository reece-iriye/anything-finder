{{- if .Values.vllm.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
  labels:
    {{- include "anything-finder.labels" . | nindent 4 }}
    app.kubernetes.io/component: vllm
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/component: vllm
  template:
    metadata:
      labels:
        {{- include "anything-finder.labels" . | nindent 8 }}
        app.kubernetes.io/component: vllm
    spec:
      {{- with .Values.vllm.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.vllm.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: vllm
          image: {{ .Values.vllm.image }}
          args:
            - --model
            - {{ .Values.vllm.model | quote }}
            - --gpu-memory-utilization
            - {{ .Values.vllm.gpuMemoryUtilization | quote }}
            - --max-model-len
            - {{ .Values.vllm.maxModelLen | quote }}
            - --host
            - "0.0.0.0"
            - --port
            - {{ .Values.vllm.service.port | quote }}
          ports:
            - containerPort: {{ .Values.vllm.service.port }}
          env:
            - name: HF_HOME
              value: /model-cache
          volumeMounts:
            - name: model-cache
              mountPath: /model-cache
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.vllm.service.port }}
            # Model download + load can take several minutes on first run.
            initialDelaySeconds: 120
            periodSeconds: 30
            failureThreshold: 20
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.vllm.service.port }}
            initialDelaySeconds: 180
            periodSeconds: 30
          resources:
            {{- toYaml .Values.vllm.resources | nindent 12 }}
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: vllm-pvc
{{- end }}
