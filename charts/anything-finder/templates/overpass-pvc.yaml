{{- if .Values.overpass.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: overpass-pvc
  labels:
    {{- include "anything-finder.labels" . | nindent 4 }}
    app.kubernetes.io/component: overpass
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.overpass.persistence.size }}
  storageClassName: {{ .Values.overpass.persistence.storageClass }}
{{- end }}
