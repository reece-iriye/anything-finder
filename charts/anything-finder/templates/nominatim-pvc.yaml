{{- if .Values.nominatim.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nominatim-pvc
  labels:
    {{- include "anything-finder.labels" . | nindent 4 }}
    app.kubernetes.io/component: nominatim
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.nominatim.persistence.size }}
  storageClassName: {{ .Values.nominatim.persistence.storageClass }}
{{- end }}
