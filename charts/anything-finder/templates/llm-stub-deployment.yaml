{{- if .Values.llmStub.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-stub
  labels:
    {{- include "anything-finder.labels" . | nindent 4 }}
    app.kubernetes.io/component: llm-stub
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: llm-stub
  template:
    metadata:
      labels:
        {{- include "anything-finder.labels" . | nindent 8 }}
        app.kubernetes.io/component: llm-stub
    spec:
      containers:
        - name: llm-stub
          image: {{ .Values.llmStub.image }}
          command: ["python", "/scripts/server.py"]
          ports:
            - containerPort: 8000
          env:
            - name: PORT
              value: "8000"
            - name: STUB_INTENT_JSON
              value: {{ .Values.llmStub.intentJson | quote }}
            - name: STUB_SYNTHESIZE_TEXT
              value: {{ .Values.llmStub.synthesizeText | quote }}
          volumeMounts:
            - name: script
              mountPath: /scripts
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              memory: 64Mi
              cpu: 50m
            limits:
              memory: 128Mi
      volumes:
        - name: script
          configMap:
            name: llm-stub-script
            defaultMode: 0755
{{- end }}
