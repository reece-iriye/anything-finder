<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Anything Finder · Telemetry</title>
<style>
/* Shared tokens, cards, conversation + telemetry styling. */
/*@include ui_common.css*/

  /* ---- console-only chrome ---- */
  .app { display:grid; grid-template-columns:322px 1fr; grid-template-rows:52px 1fr; height:100vh; }
  header { grid-column:1/-1; display:flex; align-items:center; gap:14px; padding:0 14px;
    border-bottom:1px solid var(--border); background:var(--panel); }
  .brand { display:flex; align-items:center; gap:9px; font-weight:600; }
  .brand .dot { width:9px; height:9px; border-radius:3px; background:var(--accent); box-shadow:0 0 10px 1px rgba(91,141,239,.5); }
  .brand small { color:var(--ink-faint); font-weight:400; }
  header .spacer { flex:1; }

  .sidebar { border-right:1px solid var(--border); background:var(--panel); overflow-y:auto; }
  .sidebar-head { display:flex; align-items:center; justify-content:space-between;
    padding:14px 16px 8px; font-size:11px; letter-spacing:.14em; color:var(--ink-faint); font-weight:700; }
  .runs { padding:4px 8px 24px; }
  .run { position:relative; padding:10px 12px; border-radius:9px; cursor:pointer; border:1px solid transparent;
    display:flex; flex-direction:column; gap:6px; }
  .run:hover { background:var(--panel-2); }
  .runx { position:absolute; top:6px; right:6px; width:20px; height:20px; padding:0; border-radius:6px;
    border:1px solid var(--border-soft); background:var(--panel-3); color:var(--ink-faint);
    font-size:13px; line-height:1; cursor:pointer; display:grid; place-items:center; opacity:0; transition:opacity .1s; }
  .run:hover .runx { opacity:1; }
  .runx:hover { color:var(--red); border-color:var(--red-br,#5a2f2c); background:#2e1a1a; }
  .run-title { padding-right:20px; }
  .run.on { background:#182135; border-color:#2a3c5f; }
  .run.on .run-title { color:#cfe0ff; }
  .run.live { border-color:#2a3c5f; }
  .run-title { font-size:12.5px; color:var(--ink); font-weight:500;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .run-chips { display:flex; gap:5px; flex-wrap:wrap; }
  .run-meta { display:flex; gap:6px; align-items:center; font-size:11px; color:var(--ink-faint); font-family:var(--mono); }
  .run-meta .err { color:var(--red); }
  .run-dot { width:6px; height:6px; border-radius:50%; background:var(--ink-faint); flex:none; }
  .run.on .run-dot { background:var(--accent); }
  .run.live .run-dot { background:var(--green); animation:pulse 1s infinite; }
  @keyframes pulse { 50% { opacity:.3; } }


  /* composer */
  .composer { padding:34px 28px 120px; }
  .composer h1 { margin:0 0 4px; font-size:17px; }
  .composer .lede { color:var(--ink-faint); font-size:12.5px; margin-bottom:18px; }
  .target { display:flex; align-items:center; gap:9px; padding:10px 13px; border-radius:10px;
    background:var(--panel); border:1px solid var(--border); margin-bottom:16px; font-size:12.5px; }
  .target .tdot { width:8px; height:8px; border-radius:50%; background:var(--green); flex:none; }
  .target .tdot.bad { background:var(--red); }
  .target .lbl { color:var(--ink-faint); }
  .target b { color:var(--ink); }
  .target .warn { margin-left:auto; color:var(--amber); font-size:11.5px; }
  textarea, input[type=text], input[type=number] {
    width:100%; background:var(--panel); border:1px solid var(--border); border-radius:9px;
    color:var(--ink); font:inherit; padding:10px 12px; resize:vertical; }
  textarea:focus, input:focus { outline:none; border-color:var(--accent-dim); }
  textarea { min-height:78px; font-size:13.5px; margin-bottom:12px; }
  details.optbox { border:1px solid var(--border); border-radius:10px; background:var(--panel); margin-bottom:16px; }
  details.optbox > summary { list-style:none; cursor:pointer; padding:10px 13px; font-size:12px; color:var(--ink-dim);
    display:flex; align-items:center; gap:8px; }
  details.optbox > summary::-webkit-details-marker { display:none; }
  details.optbox > summary::before { content:"▸"; color:var(--ink-faint); transition:transform .12s; }
  details.optbox[open] > summary::before { transform:rotate(90deg); }
  details.optbox[open] > summary { border-bottom:1px solid var(--border-soft); }
  details.optbox .optbody { padding:14px 13px 4px; }
  .opts { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-bottom:8px; }
  .opts label { display:flex; gap:8px; align-items:center; font-size:10.5px; letter-spacing:.05em; text-transform:uppercase; color:var(--ink-faint); margin-bottom:4px; }
  .opts label a { text-transform:none; letter-spacing:0; color:var(--accent); cursor:pointer; font-size:10px; }
  .opts .full { grid-column:1/-1; }
  .checkrow { display:flex; align-items:center; gap:8px; margin:12px 0 4px; color:var(--ink-dim); font-size:12.5px; }

  .runbtn { display:flex; align-items:center; gap:10px; }
  .spin { width:14px; height:14px; border:2px solid rgba(255,255,255,.25); border-top-color:#fff; border-radius:50%; animation:sp .7s linear infinite; }
  @keyframes sp { to { transform:rotate(360deg); } }
  .cerr { margin-top:14px; padding:10px 12px; border-radius:9px; background:#2e1a1a; border:1px solid #5a2f2c; color:var(--red); font-size:12px; font-family:var(--mono); white-space:pre-wrap; }
  .hint { color:var(--ink-faint); font-size:11.5px; margin-top:10px; }

  /* stats */
  .stats { padding:26px 30px 120px; }
  .runrow { display:grid; grid-template-columns:1fr 190px auto; gap:14px; align-items:center;
    padding:12px 4px; border-bottom:1px solid var(--border-soft); cursor:pointer; }
  .runrow:last-child { border-bottom:0; }
  .runrow:hover { background:var(--panel-2); }
  .runrow .q { font-size:12.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .runrow .q small { color:var(--ink-faint); font-family:var(--mono); }
  .runrow .mini { height:5px; border-radius:3px; background:var(--panel-3); overflow:hidden; display:flex; }
  .runrow .num { font-family:var(--mono); font-size:11px; color:var(--ink-dim); text-align:right; }

</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand"><span class="dot"></span> Anything&nbsp;Finder <small>· telemetry</small></div>
    <div class="pills" id="modePills"></div>
    <div class="spacer"></div>
    <button class="btn primary" id="newRun">＋ New run</button>
    <div class="pills" id="viewToggle">
      <button class="pill on" data-view="runs">Runs</button>
      <button class="pill" data-view="stats">Stats</button>
    </div>
    <button class="btn iconbtn" id="refresh" title="refresh">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg>
    </button>
  </header>

  <aside class="sidebar">
    <div class="sidebar-head"><span>Explorer</span><span class="badge" id="runCount">0</span></div>
    <div class="runs" id="runs"></div>
  </aside>

  <main id="main"><div class="empty">Loading…</div></main>
</div>

<script>
/* Shared primitives + the conversation renderer, also used by the generated
   comparison report (make compare). */
/*@include ui_common.js*/

const j = (u,o) => fetch(u,o).then(r=>r.json());

let S = { mode:null, apiMode:null, model:null, cfg:null, modes:[], traces:[], file:null, doc:null, view:"runs", busy:false, liveFile:null };

async function boot(){
  S.cfg = await j("/api/config").catch(()=>({api:{}}));
  S.apiMode = S.cfg.api && S.cfg.api.mode || null;
  S.model = S.cfg.api && S.cfg.api.model || null;
  const ov = await j("/api/overview");
  S.modes = ov.modes;
  renderModePills(ov);
  if (!S.mode) S.mode = S.modes.find(m=>m.name===S.apiMode)?.name || (S.modes[0] && S.modes[0].name) || S.apiMode;
  if (S.view === "compose") return renderComposer();
  if (S.mode) await selectMode(S.mode, {keep:true});
  else renderComposer();
}

function renderModePills(ov){
  const box = $("#modePills"); box.innerHTML = "";
  const seen = new Set(ov.modes.map(m=>m.name));
  const list = [...ov.modes];
  if (S.apiMode && !seen.has(S.apiMode)) list.push({name:S.apiMode, runs:0, models:S.model?[S.model]:[]});
  list.forEach(m => {
    const b = el("button","pill"+(m.name===S.mode?" on":""));
    b.dataset.mode = m.name;
    b.innerHTML = `${esc(m.name)}<span class="badge" style="margin-left:6px">${m.runs||0}</span>`;
    b.onclick = () => { S.view = "runs"; selectMode(m.name); };
    box.appendChild(b);
  });
}

async function loadTraces(mode){
  S.traces = await j("/api/traces?mode="+encodeURIComponent(mode));
  renderExplorer();
}
async function selectMode(name, {keep=false}={}){
  S.mode = name;
  [...$("#modePills").children].forEach(b=>b.classList.toggle("on", b.dataset.mode===name));
  await loadTraces(name);
  if (S.view === "stats") return renderStats();
  if (S.view === "compose") return renderComposer();
  if (keep && S.file && S.traces.some(t=>t.file===S.file)) return selectTrace(S.file);
  if (S.traces.length) return selectTrace(S.traces[0].file);
  renderComposer();
}
async function selectTrace(file){
  S.file = file; S.view = "runs"; syncToggle();
  S.doc = await j("/api/trace?file="+encodeURIComponent(file));
  renderExplorer(); renderConversation();
}

async function deleteRun(s){
  if (!confirm("Delete this run?\n\n" + (s.query || s.file))) return;
  const r = await fetch("/api/trace?file="+encodeURIComponent(s.file), {method:"DELETE"});
  if (!r.ok){ alert("Delete failed (HTTP "+r.status+")"); return; }
  const wasOpen = S.file === s.file;
  if (wasOpen){ S.file = null; S.doc = null; }
  const ov = await j("/api/overview"); S.modes = ov.modes;
  const modes = ov.modes.map(m=>m.name);
  if (!modes.includes(S.mode)) S.mode = modes[0] || S.apiMode || null;
  renderModePills(ov);
  await loadTraces(S.mode || "");
  if (S.view === "stats") return renderStats();
  if (wasOpen || !S.traces.some(t=>t.file===S.file)){
    if (S.traces.length) selectTrace(S.traces[0].file);
    else renderComposer();
  }
}

function renderExplorer(){
  $("#runCount").textContent = S.traces.length;
  const box = $("#runs"); box.innerHTML = "";
  S.traces.forEach(s => {
    const t = s.totals || {};
    const live = s.file===S.liveFile && !s.ended_at;
    const r = el("div","run"+(s.file===S.file?" on":"")+(live?" live":""));
    r.onclick = () => selectTrace(s.file);
    const x = el("button","runx","×");
    x.title = "delete run";
    x.onclick = e => { e.stopPropagation(); deleteRun(s); };
    r.appendChild(x);
    r.appendChild(el("div","run-title", s.query || "(no query)"));
    const chips = el("div","run-chips"); chips.innerHTML = modeModelChips(s.mode, s.models);
    r.appendChild(chips);
    const m = el("div","run-meta");
    m.innerHTML = `<span class="run-dot"></span>${live?"running…":esc(ago(s.started_at))}` +
      ` · ${s.span_count} spans · ${fmt((t.input_tokens||0)+(t.output_tokens||0))} tok` +
      (t.est_cost_usd?` · $${t.est_cost_usd.toFixed(4)}`:"") + (s.error?` <span class="err">· error</span>`:"");
    r.appendChild(m);
    box.appendChild(r);
  });
}


function renderConversation(){
  const d = S.doc;
  const main = $("#main"); main.innerHTML = "";
  const sh = el("div","subhead");
  sh.innerHTML = `<div class="wrap"><h1>${esc(d.query || "(no query)")}</h1>${traceMetaline(d)}</div>`;
  main.appendChild(sh);
  main.appendChild(renderConversationInto(el("div","feed wrap"), d));
}

/* ---------- composer ---------- */
const FIELDS = ["query","user_id","session_id","city","state","latitude","longitude","radius_m","include_casual"];
function loadForm(){ try { return JSON.parse(localStorage.getItem("af_form")||"{}"); } catch { return {}; } }
function saveForm(v){ try { localStorage.setItem("af_form", JSON.stringify(v)); } catch {} }
const newSession = () => (crypto.randomUUID ? crypto.randomUUID() : "sess-"+Date.now().toString(36)+Math.random().toString(36).slice(2,8));

function renderComposer(err){
  S.view = "compose"; syncToggle();
  [...$("#modePills").children].forEach(b=>b.classList.remove("on"));
  const f = loadForm();
  const api = S.cfg && S.cfg.api || {};
  const base = S.cfg && S.cfg.api_base || "";
  const ok = api.reachable;
  const target = ok
    ? `<span class="tdot"></span><span class="lbl">querying</span> <span class="chip mode">${esc(api.mode||"?")}</span>
       <span class="chip model">${esc(api.model||"unknown model")}</span>
       <span class="lbl">via ${esc(base)}</span>
       ${api.trace_enabled===false?`<span class="warn">⚠ AF_TRACE_DIR not set on the API — run won't be saved</span>`:""}`
    : `<span class="tdot bad"></span><span class="lbl">agent API unreachable at</span> <b>${esc(base)}</b>
       <span class="warn">start it: make dev  (or docker compose up)</span>`;
  const sess = f.session_id || newSession();   // fresh random id on the first turn
  const uid = f.user_id || (S.cfg && S.cfg.default_user_id) || "";
  const main = $("#main");
  main.innerHTML = `<div class="composer wrap">
    <h1>New run</h1>
    <div class="lede">Sends a restaurant query to the agent and captures the full trace.</div>
    <div class="target">${target}</div>
    <textarea id="f_query" placeholder="e.g. quiet sushi in Deep Ellum, Dallas">${esc(f.query||"")}</textarea>
    <details class="optbox">
      <summary>Options — session, user, location override</summary>
      <div class="optbody">
        <div class="opts">
          <div class="full"><label>session_id (thread — keep stable for multi-turn) <a id="regen">↻ new</a></label>
            <input type="text" id="f_session_id" value="${esc(sess)}"></div>
          <div class="full"><label>user_id (UUID — knowledge filter)</label><input type="text" id="f_user_id" value="${esc(uid)}"></div>
          <div><label>city (override)</label><input type="text" id="f_city" value="${esc(f.city||"")}"></div>
          <div><label>state (override)</label><input type="text" id="f_state" value="${esc(f.state||"")}"></div>
          <div><label>latitude</label><input type="number" step="any" id="f_latitude" value="${f.latitude??""}"></div>
          <div><label>longitude</label><input type="number" step="any" id="f_longitude" value="${f.longitude??""}"></div>
          <div><label>radius_m</label><input type="number" id="f_radius_m" value="${f.radius_m??""}"></div>
        </div>
        <label class="checkrow"><input type="checkbox" id="f_include_casual" ${f.include_casual?"checked":""}> include casual spots (fast food, cafés, bars)</label>
        <div class="hint">Location comes from the query text unless you set city/state <b>or</b> lat/lon (not both). Data is Dallas-only.</div>
      </div>
    </details>
    <button class="btn primary runbtn" id="runQuery" ${ok?"":"disabled"}>
      ${S.busy?'<span class="spin"></span> agent running…':'Run  ▸'}
    </button>
    ${err?`<div class="cerr">${esc(err)}</div>`:""}
  </div>`;
  $("#runQuery").onclick = submitQuery;
  $("#regen").onclick = e => { e.preventDefault(); $("#f_session_id").value = newSession(); };
}

function readForm(){
  const g = id => { const e = $("#f_"+id); return e ? (e.type==="checkbox"? e.checked : e.value.trim()) : ""; };
  const v = {}; FIELDS.forEach(k => v[k] = g(k));
  saveForm(v);
  const body = { query:v.query, include_casual:!!v.include_casual };
  ["user_id","session_id","city","state"].forEach(k => { if (v[k]) body[k]=v[k]; });
  ["latitude","longitude","radius_m"].forEach(k => { if (v[k]!=="") body[k]=Number(v[k]); });
  return body;
}

async function submitQuery(){
  const body = readForm();
  if (!body.query){ renderComposer("query is required"); return; }
  S.busy = true; renderComposer();
  const known = new Set((S.traces||[]).map(t=>t.file));
  const pollMode = S.apiMode || S.mode;
  const done = j("/api/query", {method:"POST", headers:{"content-type":"application/json"}, body:JSON.stringify(body)}).catch(e=>({error:String(e)}));

  const timer = setInterval(async () => {
    try {
      S.traces = await j("/api/traces?mode="+encodeURIComponent(pollMode));
      const fresh = S.traces.find(t=>!known.has(t.file));
      if (fresh){
        S.liveFile = fresh.file; S.mode = pollMode;
        [...$("#modePills").children].forEach(b=>b.classList.toggle("on", b.dataset.mode===pollMode));
        S.doc = await j("/api/trace?file="+encodeURIComponent(fresh.file));
        S.file = fresh.file; S.view = "runs";
        renderExplorer(); renderConversation();
      } else renderExplorer();
    } catch {}
  }, 1200);

  const res = await done;
  clearInterval(timer);
  S.busy = false; S.liveFile = null;
  await boot();
  if (res && res.error){ renderComposer("request failed:\n"+res.error); return; }
  if (res && res.trace_file){
    const m = res.trace_file.split("/")[0];
    S.mode = m;
    await loadTraces(m);
    [...$("#modePills").children].forEach(b=>b.classList.toggle("on", b.dataset.mode===m));
    selectTrace(res.trace_file);
  } else if (res && res.status && res.status >= 400){
    renderComposer("agent API returned HTTP "+res.status+"\n"+JSON.stringify(res.response,null,2));
  }
}

/* ---------- stats ---------- */
function renderStats(){
  const m = S.modes.find(x=>x.name===S.mode);
  const main = $("#main"); main.innerHTML = "";
  if (!m || !m.runs){ main.innerHTML = `<div class="empty">No runs in <b>${esc(S.mode||"")}</b>. Hit <b>＋ New run</b>.</div>`; return; }
  const wrap = el("div","stats wrap");
  const totTok = m.input_tokens + m.output_tokens + m.cache_read_tokens;
  const barRow = (icon,label,val,denom,color) => {
    const pct = denom ? val/denom*100 : 0;
    return `<div class="bar-row"><span class="lbl">${icon}${label}</span>
      <span class="bar-track"><span class="bar-fill" style="width:${Math.max(pct,val?1.5:0)}%;background:${color}"></span></span>
      <span class="val">${Number(val).toLocaleString()}<span class="pct">${pct.toFixed(1)}%</span></span></div>`;
  };
  const p1 = el("div","panel");
  p1.innerHTML = `<h2>${IC.bolt} Token statistics</h2>
    <div class="caption">${modeModelChips(m.name, m.models)} &nbsp; ${m.runs} run${m.runs>1?"s":""}</div>
    <div class="bars">
      ${barRow(IC.brain,"Input",m.input_tokens,totTok,"var(--green)")}
      ${barRow(IC.bolt,"Output",m.output_tokens,totTok,"var(--blue)")}
      ${barRow(IC.eye,"Cache read",m.cache_read_tokens,totTok,"var(--amber)")}
    </div>
    <div class="tiles">
      <div class="tile"><div class="n">${fmt(m.input_tokens+m.output_tokens)}</div><div class="t">total tokens</div></div>
      <div class="tile"><div class="n green">${fmt(m.input_tokens)}</div><div class="t">input</div></div>
      <div class="tile"><div class="n blue">${fmt(m.output_tokens)}</div><div class="t">output</div></div>
      <div class="tile"><div class="n amber">${fmt(m.cache_read_tokens)}</div><div class="t">cache read</div></div>
      <div class="tile"><div class="n">${m.runs}</div><div class="t">runs</div></div>
    </div>
    <div class="range">
      <span>● first ${m.first?new Date(m.first).toLocaleString():"—"}</span>
      <span>● last ${m.last?new Date(m.last).toLocaleString():"—"}</span>
    </div>`;
  wrap.appendChild(p1);
  const p2 = el("div","panel");
  p2.innerHTML = `<h2>${IC.wrench} Calls & cost</h2><div class="caption">across ${m.runs} run${m.runs>1?"s":""}</div>
    <div class="tiles">
      <div class="tile"><div class="n">${m.llm_calls}</div><div class="t">LLM calls</div></div>
      <div class="tile"><div class="n">${m.tool_calls}</div><div class="t">tool calls</div></div>
      <div class="tile"><div class="n violet">${(m.llm_calls/m.runs).toFixed(1)}</div><div class="t">LLM / run</div></div>
      <div class="tile"><div class="n green">${m.est_cost_usd?"$"+m.est_cost_usd.toFixed(4):"—"}</div><div class="t">est. cost</div></div>
    </div>`;
  wrap.appendChild(p2);
  const p3 = el("div","panel");
  p3.innerHTML = `<h2>${IC.msg} Runs</h2><div class="caption">newest first · click to open</div>`;
  S.traces.forEach(s => {
    const t = s.totals||{}, inT=t.input_tokens||0, outT=t.output_tokens||0, tot=inT+outT||1;
    const row = el("div","runrow");
    row.innerHTML = `<div class="q">${esc(s.query||"(no query)")} <small>· ${ago(s.started_at)}</small></div>
      <div class="mini"><span style="width:${inT/tot*100}%;background:var(--green)"></span><span style="width:${outT/tot*100}%;background:var(--blue)"></span></div>
      <div class="num">${fmt(inT)}/${fmt(outT)} · ${t.llm_calls||0}L/${t.tool_calls||0}T${t.est_cost_usd?` · $${t.est_cost_usd.toFixed(4)}`:""}</div>`;
    row.onclick = () => selectTrace(s.file);
    p3.appendChild(row);
  });
  wrap.appendChild(p3);
  main.appendChild(wrap);
}

function syncToggle(){ [...$("#viewToggle").children].forEach(b=>b.classList.toggle("on", b.dataset.view===S.view)); }
$("#viewToggle").onclick = e => { const b=e.target.closest(".pill"); if(!b) return;
  S.view = b.dataset.view; syncToggle();
  S.view==="stats" ? renderStats() : (S.file && S.traces.some(t=>t.file===S.file) ? selectTrace(S.file) : selectMode(S.mode)); };
$("#newRun").onclick = () => renderComposer();
$("#refresh").onclick = () => boot();
boot();
</script>
</body>
</html>
