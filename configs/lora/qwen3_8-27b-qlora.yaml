# The real run: distil the Claude restaurant-ReAct trajectories into a LoRA
# adapter for Qwen3.8-27B (BF16 base, 4-bit QLoRA). Serve the adapter on the FP8
# repo in vLLM — see compose.claude.yaml and the README "Fine-tuning" section.
#
#   uv run scripts/train_lora.py --config configs/lora/qwen3_8-27b-qlora.yaml
#   uv run scripts/train_lora.py --config configs/lora/qwen3_8-27b-qlora.yaml --set train.learning_rate=5e-5

run_name: qwen38-27b-restaurant-react-lora
seed: 20260902
output_dir: data/lora/runs/qwen38-27b-restaurant-react-lora

model:
  base_model: Qwen/Qwen3.8-27B        # BF16 base. FP8 repo is for SERVING only.
  dtype: bfloat16
  trust_remote_code: true
  attn_implementation: flash_attention_2   # auto-falls back to sdpa
  load_in_4bit: true                  # flip false for full-BF16 LoRA on a bigger box
  bnb_4bit_quant_type: nf4
  bnb_4bit_compute_dtype: bfloat16
  bnb_4bit_use_double_quant: true
  gradient_checkpointing: true

data:
  train_file: data/lora/train.jsonl
  eval_file: data/lora/val.jsonl
  tool_schemas: data/lora/tool_schemas.json
  max_seq_len: 4096
  chat_template_kwargs: {enable_thinking: false}
  train_on_assistant_only: true
  on_overlong: drop                   # drop | truncate

lora:
  r: 32
  alpha: 64
  dropout: 0.05
  bias: none
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  exclude_modules: [visual, vision_tower]   # keep the vision encoder frozen
  modules_to_save: []

train:
  num_train_epochs: 3
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 1.0e-4
  lr_scheduler_type: cosine
  warmup_ratio: 0.03
  max_grad_norm: 1.0
  optim: paged_adamw_8bit
  bf16: true
  logging_steps: 5
  eval_strategy: epoch
  save_strategy: epoch
  save_total_limit: 3
  report_to: [tensorboard]

hub:
  push_to_hub: false
  hub_model_id: null                  # <hf-user>/anything-finder-qwen38-27b-lora
  hub_private_repo: true
