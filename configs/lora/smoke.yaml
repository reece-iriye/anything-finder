# Pipeline-validation run: tiny model, 20 steps. Proves the data prep, collator,
# masking, PEFT wiring and adapter save end to end for a few dollars (or free on
# CPU with --dry-run).
#
#   make lora-smoke                                   # --dry-run, no GPU
#   uv run scripts/train_lora.py --config configs/lora/smoke.yaml   # real 20-step run

run_name: qwen3-0_6b-restaurant-react-smoke
seed: 20260902
output_dir: data/lora/runs/smoke

model:
  base_model: Qwen/Qwen3-0.6B
  dtype: bfloat16
  trust_remote_code: true
  attn_implementation: sdpa
  load_in_4bit: false
  gradient_checkpointing: false

data:
  train_file: data/lora/train.jsonl
  eval_file: data/lora/val.jsonl
  tool_schemas: data/lora/tool_schemas.json
  max_seq_len: 4096
  chat_template_kwargs: {enable_thinking: false}
  train_on_assistant_only: true
  on_overlong: drop

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  bias: none
  target_modules: [q_proj, k_proj, v_proj, o_proj]
  exclude_modules: []
  modules_to_save: []

train:
  num_train_epochs: 1
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 4
  learning_rate: 2.0e-4
  lr_scheduler_type: constant
  warmup_ratio: 0.0
  max_grad_norm: 1.0
  optim: adamw_torch
  bf16: true
  logging_steps: 1
  eval_strategy: "no"
  save_strategy: "no"
  save_total_limit: 1
  report_to: []
  max_steps: 20

hub:
  push_to_hub: false
  hub_model_id: null
  hub_private_repo: true
