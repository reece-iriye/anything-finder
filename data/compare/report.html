<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Anything Finder · Model comparison</title>
<style>
/* Shared tokens, cards, conversation + telemetry styling. */
/* Shared styling for the telemetry console (scripts/trace_ui.html) and the
   generated comparison report (scripts/compare_report.html).

   Both pages inline this file at build/serve time via an `@include` marker —
   there is no <link>, because the report has to open from disk with no server.
   Console-only chrome (app grid, sidebar, run list, composer) stays in
   trace_ui.html; report-only layout stays in compare_report.html. */

:root {
  --bg:#0b0b0d; --panel:#111114; --panel-2:#16161a; --panel-3:#1b1b20;
  --border:#26262d; --border-soft:#1e1e24;
  --ink:#e7e7ec; --ink-dim:#9c9ca7; --ink-faint:#6c6c76;
  --accent:#5b8def; --accent-dim:#3b6fd4;
  --user-bubble:#2f5fc0;
  --green:#65d09a; --amber:#e0b877; --blue:#8fb4f0; --violet:#b79be8; --red:#f0857f;
  --mono:"SF Mono",ui-monospace,"JetBrains Mono",Menlo,Consolas,monospace;
  --sans:-apple-system,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
* { box-sizing:border-box; }
html,body { height:100%; }
body { margin:0; background:var(--bg); color:var(--ink); font-family:var(--sans);
  font-size:13.5px; line-height:1.5; -webkit-font-smoothing:antialiased; }
::-webkit-scrollbar { width:10px; height:10px; }
::-webkit-scrollbar-thumb { background:#2c2c34; border-radius:6px; border:2px solid var(--bg); }

/* ---- controls ---- */
.pills { display:flex; gap:4px; background:var(--panel-3); padding:3px; border-radius:9px; border:1px solid var(--border-soft); }
.pill { border:0; background:transparent; color:var(--ink-dim); font:inherit; font-size:12px;
  padding:5px 11px; border-radius:7px; cursor:pointer; white-space:nowrap; }
.pill.on { background:var(--panel); color:var(--ink); box-shadow:0 1px 2px rgba(0,0,0,.3); }
.pill:hover:not(.on) { color:var(--ink); }
.btn { border:1px solid var(--border-soft); background:var(--panel-3); color:var(--ink-dim);
  font:inherit; font-size:12px; padding:6px 12px; border-radius:8px; cursor:pointer; display:flex; align-items:center; gap:6px; }
.btn:hover { color:var(--ink); border-color:var(--border); }
.btn.primary { background:var(--accent-dim); border-color:var(--accent); color:#fff; }
.btn.primary:hover { background:var(--accent); }
.btn:disabled { opacity:.5; cursor:default; }
.iconbtn { width:30px; height:30px; padding:0; justify-content:center; }
.badge { background:var(--panel-3); border:1px solid var(--border-soft); color:var(--ink-dim);
  border-radius:20px; padding:1px 8px; font-size:11px; font-weight:600; letter-spacing:0; }

.chip { font-family:var(--mono); font-size:10px; padding:1px 6px; border-radius:5px;
  border:1px solid var(--border-soft); background:var(--panel-3); color:var(--ink-dim); white-space:nowrap; }
.chip.mode { color:var(--accent); border-color:#2a3c5f; background:#151d2e; font-weight:600; }
.chip.model { color:var(--violet); border-color:#3b3057; background:#1e1830; }
.chip.bad { color:var(--red); border-color:#5a2f2c; background:#2e1a1a; }

/* ---- page frame ---- */
main { overflow-y:auto; background:var(--bg); }
.wrap { max-width:960px; margin:0 auto; }
.subhead { position:sticky; top:0; z-index:5; background:var(--bg);
  padding:16px 28px 12px; border-bottom:1px solid var(--border-soft); }
.subhead h1 { margin:0 0 8px; font-size:16px; font-weight:600; }
.metaline { display:flex; flex-wrap:wrap; gap:6px 9px; align-items:center; font-size:11.5px; color:var(--ink-dim); }
.metaline .chip { font-size:11px; padding:2px 8px; }
.feed { padding:22px 28px 140px; }
.turn { margin-bottom:22px; }
.empty { color:var(--ink-faint); padding:60px 30px; text-align:center; font-size:13px; }
svg.ic { width:14px; height:14px; flex:none; }

/* ---- the "how to read a run" primer ---- */
details.primer { border:1px solid #2a3c5f; background:#141c2c; border-radius:11px; margin-bottom:24px; }
details.primer > summary { cursor:pointer; list-style:none; padding:11px 14px; font-size:12.5px; color:var(--blue); font-weight:600; display:flex; gap:8px; align-items:center; }
details.primer > summary::-webkit-details-marker { display:none; }
details.primer > summary::before { content:"▸"; transition:transform .12s; }
details.primer[open] > summary::before { transform:rotate(90deg); }
details.primer .pbody { padding:2px 15px 15px; font-size:12.5px; color:var(--ink-dim); line-height:1.65; }
details.primer .pbody b { color:var(--ink); }
details.primer .pbody em { color:var(--violet); font-style:normal; font-weight:600; }
details.primer ol { margin:8px 0 0; padding-left:20px; }
details.primer li { margin:3px 0; }

/* ---- conversation steps ---- */
.stephdr { display:flex; align-items:center; gap:9px; margin:2px 0 10px; font-size:12px; }
.stephdr .n { width:20px; height:20px; border-radius:6px; background:#1e2a44; color:var(--blue);
  display:grid; place-items:center; font-weight:700; font-size:11px; font-family:var(--mono); flex:none; }
.stephdr .d { color:var(--ink-dim); }

.callout { font-size:12px; color:var(--ink-dim); background:var(--panel);
  border:1px dashed var(--border); border-radius:8px; padding:8px 11px; margin:2px 0 9px; }
.callout b { color:var(--ink); }

.rt { border:1px solid var(--border); border-radius:10px; background:var(--panel-2); margin-bottom:9px; overflow:hidden; }
.rt-name { display:flex; align-items:center; gap:8px; padding:9px 12px; background:var(--panel);
  border-bottom:1px solid var(--border-soft); font-weight:600; font-size:12.5px; color:var(--green); }
.rt-name .idpill { margin-left:auto; font-family:var(--mono); font-size:10px; color:var(--ink-faint);
  background:var(--panel-3); border:1px solid var(--border-soft); padding:1px 6px; border-radius:5px; font-weight:400; }
.rt-name .dur { font-family:var(--mono); font-size:10.5px; color:var(--ink-faint); font-weight:400; }
.rt-step { padding:10px 12px; }
.rt-step + .rt-step { border-top:1px solid var(--border-soft); }
.rt-step .lab { display:flex; align-items:center; gap:7px; font-size:11px; color:var(--ink-faint);
  text-transform:uppercase; letter-spacing:.06em; margin-bottom:3px; }
.rt-step .lab .mk { width:15px; height:15px; border-radius:4px; background:var(--panel-3); border:1px solid var(--border-soft);
  display:grid; place-items:center; font-size:9px; color:var(--ink-dim); font-family:var(--mono); flex:none; }
.rt-step.model .lab { color:var(--violet); } .rt-step.model .lab .mk { border-color:#3b3057; color:var(--violet); }
.rt-step.run .lab { color:var(--ink-dim); }
.rt-step.res .lab { color:var(--green); } .rt-step.res .lab .mk { border-color:#274636; color:var(--green); }
.rt-step.res.bad .lab { color:var(--red); }
.rt-step .lab code { font-family:var(--mono); text-transform:none; letter-spacing:0; color:var(--ink-dim);
  background:var(--panel-3); border:1px solid var(--border-soft); border-radius:4px; padding:0 4px; }
.rt-step .kv .m { color:var(--ink-faint); }
.rt-arrow { text-align:center; color:var(--ink-faint); font-size:12px; padding:1px 0; }
.fromprev { display:inline-block; margin-left:8px; font-family:var(--mono); font-size:10px; color:var(--amber);
  background:var(--panel); border:1px solid #463b23; border-radius:5px; padding:0 5px; }
.pending { color:var(--amber); font-size:11.5px; font-family:var(--mono); padding:4px 0; }
.turn-label { display:flex; align-items:center; gap:8px; margin-bottom:7px; font-size:11.5px; color:var(--ink-faint); }
.turn-label .who { color:var(--ink-dim); font-weight:600; }
.turn-label .model { margin-left:auto; font-family:var(--mono); font-size:10.5px; color:var(--ink-faint);
  background:var(--panel-2); border:1px solid var(--border-soft); padding:1px 7px; border-radius:6px; }
.bubble { background:var(--user-bubble); color:#fff; padding:10px 14px; border-radius:12px 12px 4px 12px;
  max-width:75%; margin-left:auto; white-space:pre-wrap; font-size:13px; }

/* ---- collapsible cards ---- */
.card { border:1px solid var(--border); background:var(--panel-2); border-radius:10px;
  margin-bottom:8px; overflow:hidden; border-left:3px solid var(--border); }
.card > .card-head { display:flex; align-items:center; gap:9px; padding:9px 12px; cursor:pointer; user-select:none; }
.card > .card-head:hover { background:rgba(255,255,255,.02); }
.card.text > .card-head { cursor:default; } .card.text > .card-head:hover { background:none; }
.card .chev { transition:transform .12s; color:var(--ink-faint); flex:none; }
.card.open .chev { transform:rotate(90deg); }
.card .ttl { font-weight:500; font-size:12.5px; }
.card .idpill { margin-left:auto; font-family:var(--mono); font-size:10px; color:var(--ink-dim);
  background:var(--panel-3); border:1px solid var(--border-soft); padding:1px 6px; border-radius:5px; }
.card .body { display:none; padding:0 12px 12px; }
.card.open .body { display:block; }
.card.text { border-left-color:#3a3a44; }
.card.text .body { display:block; padding:2px 13px 12px; }
.card.io { border-left-color:#33333c; background:var(--panel); }
.card.io .ttl { color:var(--ink-faint); font-weight:400; }
.card.think { border-left-color:var(--amber); } .card.think .ttl { color:var(--amber); }
.card.tool { border-left-color:var(--green); } .card.tool .ttl { color:var(--green); }
.card.result { border-left-color:var(--violet); } .card.result .ttl { color:var(--violet); }
.card.err { border-left-color:var(--red); } .card.err .ttl { color:var(--red); }

pre.code { margin:8px 0 0; padding:11px 12px; background:#0c0c0f; border:1px solid var(--border-soft);
  border-radius:8px; overflow-x:auto; font-family:var(--mono); font-size:11.5px; line-height:1.55; color:#c9c9d2; white-space:pre; }
.msgtext { white-space:pre-wrap; font-size:13px; color:var(--ink); }
.msgtext strong { color:#fff; font-weight:650; } .msgtext em { color:var(--ink-dim); }
.msgtext code { font-family:var(--mono); font-size:11.5px; background:#0c0c0f; border:1px solid var(--border-soft); border-radius:4px; padding:0 4px; }
.kv { display:flex; flex-wrap:wrap; gap:5px 14px; margin-top:9px; font-family:var(--mono); font-size:10.5px; color:var(--ink-faint); }
.kv b { color:var(--ink-dim); font-weight:600; }

/* ---- per-span telemetry strip ---- */
details.telem { border:1px solid var(--border-soft); border-radius:9px; background:var(--panel); margin-top:2px; }
details.telem > summary { list-style:none; cursor:pointer; padding:8px 12px; font-size:11px; color:var(--ink-dim);
  display:flex; gap:13px; flex-wrap:wrap; align-items:center; font-family:var(--mono); }
details.telem > summary::-webkit-details-marker { display:none; }
details.telem > summary .m { color:var(--ink-faint); }
details.telem > summary::before { content:"▸"; color:var(--ink-faint); transition:transform .12s; }
details.telem[open] > summary::before { transform:rotate(90deg); }
details.telem b { color:var(--ink); font-weight:600; }
details.telem .telem-body { padding:2px 12px 12px; }
details.sub { margin-top:8px; }
details.sub > summary { cursor:pointer; font-size:11px; color:var(--ink-faint); font-family:var(--mono); list-style:none; }
details.sub > summary::-webkit-details-marker { display:none; }
details.sub > summary::before { content:"▸ "; }
details.sub[open] > summary::before { content:"▾ "; }

/* ---- stat panels ---- */
.panel { border:1px solid var(--border); background:var(--panel); border-radius:14px; padding:20px 22px; margin-bottom:20px; }
.panel h2 { margin:0 0 3px; font-size:15px; display:flex; align-items:center; gap:9px; }
.panel .caption { color:var(--ink-faint); font-size:12px; margin-bottom:18px; }
.bars { display:flex; flex-direction:column; gap:14px; margin-bottom:22px; }
.bar-row { display:grid; grid-template-columns:150px 1fr auto; gap:12px; align-items:center; }
.bar-row .lbl { display:flex; align-items:center; gap:8px; color:var(--ink-dim); font-size:12px; }
.bar-track { height:6px; border-radius:4px; background:var(--panel-3); overflow:hidden; }
.bar-fill { height:100%; border-radius:4px; }
.bar-row .val { font-family:var(--mono); font-size:12px; text-align:right; min-width:120px; }
.bar-row .val .pct { color:var(--ink-faint); margin-left:8px; font-size:11px; }
.tiles { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:1px; background:var(--border-soft);
  border:1px solid var(--border-soft); border-radius:12px; overflow:hidden; }
.tile { background:var(--panel); padding:20px 16px; text-align:center; }
.tile .n { font-size:24px; font-weight:650; }
.tile .t { margin-top:5px; font-size:10.5px; letter-spacing:.12em; color:var(--ink-faint); text-transform:uppercase; }
.tile .n.green { color:var(--green); } .tile .n.blue { color:var(--blue); }
.tile .n.violet { color:var(--violet); } .tile .n.amber { color:var(--amber); }
.range { display:flex; justify-content:space-between; margin-top:16px; font-family:var(--mono); font-size:11px; color:var(--ink-faint); }


  /* ---- report-only layout ---- */
  body { overflow-y:auto; }
  .page { max-width:1400px; margin:0 auto; padding:0 26px 120px; }
  header.rpt { display:flex; align-items:center; gap:14px; padding:18px 26px 14px; position:sticky; top:0; z-index:20;
    background:var(--bg); border-bottom:1px solid var(--border); margin:0 -26px 22px; }
  .brand { display:flex; align-items:center; gap:9px; font-weight:600; }
  .brand .dot { width:9px; height:9px; border-radius:3px; background:var(--accent); box-shadow:0 0 10px 1px rgba(91,141,239,.5); }
  .brand small { color:var(--ink-faint); font-weight:400; }
  header.rpt .spacer { flex:1; }
  .stamp { font-family:var(--mono); font-size:11px; color:var(--ink-faint); }

  h2.sec { font-size:15px; margin:30px 0 4px; }
  .lede { color:var(--ink-faint); font-size:12.5px; margin-bottom:16px; max-width:74ch; }

  /* leaderboard */
  .lb { width:100%; border-collapse:collapse; font-size:12.5px; }
  .lb th, .lb td { text-align:right; padding:9px 12px; border-bottom:1px solid var(--border-soft); white-space:nowrap; }
  .lb th { color:var(--ink-faint); font-weight:600; font-size:10.5px; letter-spacing:.09em; text-transform:uppercase; }
  .lb td.mode, .lb th.mode { text-align:left; }
  .lb tbody tr:hover { background:var(--panel-2); }
  .lb td.num { font-family:var(--mono); }
  .lb .best { color:var(--green); font-weight:650; }
  .lb .worst { color:var(--amber); }
  .lb-wrap { overflow-x:auto; border:1px solid var(--border); border-radius:12px; background:var(--panel); padding:4px 8px 2px; }

  .pathlist { display:flex; flex-direction:column; gap:6px; margin-top:12px; }
  .pathrow { display:grid; grid-template-columns:1fr 60px; gap:12px; align-items:center; font-size:11.5px; }
  .pathrow .sig { font-family:var(--mono); color:var(--ink-dim); overflow:hidden; text-overflow:ellipsis; }
  .pathrow .n { font-family:var(--mono); color:var(--ink-faint); text-align:right; }

  /* query picker */
  .picker { display:flex; gap:10px; align-items:center; margin-bottom:14px; flex-wrap:wrap; }
  select, .search { background:var(--panel); border:1px solid var(--border); border-radius:9px;
    color:var(--ink); font:inherit; font-size:12.5px; padding:8px 11px; }
  select { max-width:min(720px,100%); }
  .search { width:230px; }

  /* side-by-side columns */
  .cols { display:grid; gap:14px; align-items:start;
    grid-template-columns:repeat(auto-fit,minmax(330px,1fr)); }
  .col { border:1px solid var(--border); border-radius:12px; background:var(--panel); overflow:hidden; }
  .col-head { padding:12px 14px; border-bottom:1px solid var(--border-soft); background:var(--panel-2);
    display:flex; flex-direction:column; gap:7px; }
  .col-head .chips { display:flex; gap:5px; flex-wrap:wrap; }
  .col-body { padding:13px 14px 15px; }
  .answer { white-space:pre-wrap; font-size:12.5px; line-height:1.6; }
  .missing { color:var(--ink-faint); font-style:italic; font-size:12.5px; }
  .errbox { color:var(--red); background:#2e1a1a; border:1px solid #5a2f2c; border-radius:8px;
    padding:9px 11px; font-family:var(--mono); font-size:11.5px; white-space:pre-wrap; }
  .pathchain { display:flex; flex-wrap:wrap; gap:5px; align-items:center; font-family:var(--mono); font-size:10.5px; }
  .pathchain .step { border:1px solid var(--border-soft); background:var(--panel-3); color:var(--ink-dim);
    border-radius:5px; padding:1px 6px; }
  .pathchain .step.diff { border-color:#463b23; color:var(--amber); }
  .pathchain .arr { color:var(--ink-faint); }
  .statline { display:flex; flex-wrap:wrap; gap:4px 12px; font-family:var(--mono); font-size:10.5px;
    color:var(--ink-faint); margin-top:11px; }
  .statline b { color:var(--ink-dim); font-weight:600; }
  .flags { display:flex; gap:5px; flex-wrap:wrap; margin-top:10px; }
  .flag { font-size:10px; border-radius:5px; padding:1px 6px; border:1px solid var(--border-soft);
    background:var(--panel-3); color:var(--ink-faint); font-family:var(--mono); }
  .flag.ok { color:var(--green); border-color:#274636; background:#132119; }
  .flag.no { color:var(--red); border-color:#5a2f2c; background:#2e1a1a; }
  .targets { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px; }

  .drill { margin-top:14px; border-top:1px solid var(--border-soft); padding-top:6px; }
  .drill > summary { cursor:pointer; list-style:none; font-size:11.5px; color:var(--accent);
    padding:6px 0; display:flex; gap:7px; align-items:center; }
  .drill > summary::-webkit-details-marker { display:none; }
  .drill > summary::before { content:"▸"; transition:transform .12s; }
  .drill[open] > summary::before { transform:rotate(90deg); }
  .drill .feed { padding:8px 0 4px; }
  .drill .turn { margin-bottom:16px; }
</style>
</head>
<body>
<header class="rpt">
  <div class="brand"><span class="dot"></span> Anything&nbsp;Finder <small>· model comparison</small></div>
  <div class="pills" id="viewToggle">
    <button class="pill on" data-view="leaderboard">Leaderboard</button>
    <button class="pill" data-view="queries">Side by side</button>
  </div>
  <div class="spacer"></div>
  <div class="stamp" id="stamp"></div>
</header>

<div class="page"><main id="main"><div class="empty">Loading…</div></main></div>

<script>
/* Shared primitives + the conversation renderer, also used by the live
   telemetry console (make trace). */
/* Shared rendering for the telemetry console (scripts/trace_ui.html) and the
   generated comparison report (scripts/compare_report.html).

   The one thing worth keeping in sync between the two pages is how a trace is
   drawn: a run is a sequence of steps, and each tool the model calls is a
   round-trip — ① the arguments the model generated, ② your app running the
   tool, ③ the result handed back. `renderConversationInto` is that renderer;
   everything above it are the primitives it needs.

   Both pages inline this file (no <script src>) because the report must open
   from disk with no server. Nothing here touches global page state or fetch. */

const $ = (s,r=document)=>r.querySelector(s);
const el = (t,cls,txt)=>{const e=document.createElement(t); if(cls)e.className=cls; if(txt!=null)e.textContent=txt; return e;};
const fmt = n => (n==null?"—":n>=1e6?(n/1e6).toFixed(2)+"M":n>=1e4?(n/1e3).toFixed(1)+"K":Number(n).toLocaleString());
const esc = s => String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const mdInline = s => esc(s)
  .replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>")
  .replace(/\*([^*\n]+)\*/g,"<em>$1</em>")
  .replace(/`([^`]+)`/g,"<code>$1</code>")
  .replace(/^#{1,6}\s+(.+)$/gm,"<strong>$1</strong>");
function ago(iso){ if(!iso) return ""; const s=(Date.now()-new Date(iso).getTime())/1000;
  if(s<60) return "just now"; if(s<3600) return Math.floor(s/60)+"m ago";
  if(s<86400) return Math.floor(s/3600)+"h ago"; return Math.floor(s/86400)+"d ago"; }
function clock(iso){ try{ return new Date(iso).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit",second:"2-digit"}); }catch{ return ""; } }

const IC = {
  brain:'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9.5 2A2.5 2.5 0 007 4.5v.5a3 3 0 00-1 5.83V15a3 3 0 003 3h.5A2.5 2.5 0 0012 15.5v-11A2.5 2.5 0 009.5 2zM14.5 2A2.5 2.5 0 0117 4.5v.5a3 3 0 011 5.83V15a3 3 0 01-3 3h-.5A2.5 2.5 0 0112 15.5"/></svg>',

  result:'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 6L9 17l-5-5"/></svg>',

function modeModelChips(mode, models){
  return `<span class="chip mode">${esc(mode||"?")}</span>` +
    (models||[]).map(m=>`<span class="chip model">${esc(m)}</span>`).join("");
}

/* ---------- primitives ---------- */
function card(kind, titleHTML, opts={}){
  const c = el("div","card "+kind+(opts.open?" open":""));
  const h = el("div","card-head");
  h.innerHTML = (kind==="text"?"":IC.chev) + `<span class="ttl">${titleHTML}</span>` +
    (opts.id?`<span class="idpill">${esc(opts.id)}</span>`:"");
  const b = el("div","body"); if (opts.bodyHTML) b.innerHTML = opts.bodyHTML;
  if (kind!=="text") h.onclick = () => c.classList.toggle("open");
  c.append(h,b); return c;
}
function codeBlock(v){
  let s;
  if (typeof v === "string"){ const t=v.trim();
    if (t && (t[0]==="{"||t[0]==="[")){ try{ s=JSON.stringify(JSON.parse(t),null,2); }catch{ s=v; } } else s=v;
  } else s = JSON.stringify(v,null,2);
  if (s.length > 40000) s = s.slice(0,40000) + "\n… (" + (s.length-40000) + " more chars)";
  return `<pre class="code">${esc(s)}</pre>`;
}
const textOf = t => Array.isArray(t) ? t.filter(b=>b&&b.type==="text").map(b=>b.text).join("") : (t||"");

function telemBlock(s){
  const tok = s.tokens||{}, out = s.output||{}, p = s.params||{};
  const d = el("details","telem"); d.open = true;
  const sum = el("summary");
  sum.innerHTML = IC.bolt +
    `<span><b>${tok.input??0}</b> <span class="m">in</span></span>` +
    `<span><b>${tok.output??0}</b> <span class="m">out</span></span>` +
    (tok.cache_read?`<span><b>${tok.cache_read}</b> <span class="m">cache</span></span>`:"") +
    (s.est_cost_usd?`<span><b>$${s.est_cost_usd.toFixed(6)}</b></span>`:"") +
    (out.finish_reason?`<span class="m">finish</span> <b>${esc(out.finish_reason)}</b>`:"") +
    (s.duration_s!=null?`<span><b>${s.duration_s}</b><span class="m">s</span></span>`:"");
  const body = el("div","telem-body");
  const bits = [];
  if (p.temperature!=null) bits.push(`<span>temperature <b>${p.temperature}</b></span>`);
  if (p.max_tokens!=null) bits.push(`<span>max_tokens <b>${p.max_tokens}</b></span>`);
  if (p.tools && p.tools.length) bits.push(`<span>tools <b>${p.tools.length}</b>: ${p.tools.map(esc).join(", ")}</span>`);
  // The comparison report ships slimmed traces (input_messages stripped to keep
  // the file small) and leaves the count behind, so say how many there were.
  const msgs = s.input_messages || [];
  const nMsgs = s.input_message_count != null ? s.input_message_count : msgs.length;
  const msgBody = msgs.length ? codeBlock(msgs)
    : `<div class="kv"><span class="m">(not included in this report — rebuild with <b>make compare ARGS=--full</b>)</span></div>`;
  body.innerHTML =
    (bits.length?`<div class="kv">${bits.join("")}</div>`:"") +
    `<details class="sub"><summary>${nMsgs} input message(s)</summary>${msgBody}</details>` +
    (out.content_blocks?`<details class="sub"><summary>raw content blocks</summary>${codeBlock(out.content_blocks)}</details>`:"");
  d.append(sum, body);
  return d;
}

function primer(){
  const d = el("details","primer");
  try { d.open = localStorage.getItem("af_primer_open") !== "0"; } catch { d.open = true; }
  d.addEventListener("toggle", () => { try { localStorage.setItem("af_primer_open", d.open?"1":"0"); } catch {} });
  d.innerHTML = `<summary>How to read this run</summary>
    <div class="pbody">
      The model does <b>not</b> search, geocode, or read files itself. Each step it does one of two things:
      reply with <b>text</b>, or emit one or more <b>tool requests</b> — a tool name plus arguments it writes as JSON.
      Your application executes each tool and returns the result; the model reads it and continues to the next step.
      <ol>
        <li><b>①</b> the arguments the <em>model</em> generated for a tool</li>
        <li><b>②</b> your app runs that tool with those arguments</li>
        <li><b>③</b> the result handed back to the model — which it uses to write the next step's arguments</li>
      </ol>
      An <span class="fromprev">↑ from step N</span> tag means that argument value came straight out of an earlier tool's result.
    </div>`;
  return d;
}

function stepHeader(n, s, txt, tcs){
  const h = el("div","stephdr");
  let desc;
  if (s.error) desc = "the model call failed";
  else if (tcs.length) desc = `the model ${txt.trim()?"replied, then ":""}requested ${tcs.length} tool${tcs.length>1?"s":""}: ` +
    tcs.map(t=>`<b>${esc(t.name)}</b>`).join(", ");
  else desc = "the model wrote its final answer";
  h.innerHTML = `<span class="n">${n}</span><span class="d">Step ${n} — ${desc}</span>
    <span class="model" style="margin-left:auto">${esc(s.model||"?")}${s.duration_s!=null?` · ${s.duration_s}s`:""}</span>`;
  return h;
}

function callout(html){ const c = el("div","callout"); c.innerHTML = html; return c; }

// which top-level arg values trace back to an earlier tool's output
function fromPrev(args, priorOut){
  const hits = {};
  if (!args || typeof args !== "object") return hits;
  Object.entries(args).forEach(([k,v]) => {
    if (v == null || v === "" || v === true || v === false) return;
    const needle = JSON.stringify(v);
    if (needle.length < 3) return;
    const src = priorOut.find(o => o.json.includes(needle));
    if (src) hits[k] = src;
  });
  return hits;
}

function argsTable(args, priorOut){
  if (!args || typeof args !== "object" || Array.isArray(args)) return codeBlock(args ?? {});
  if (!Object.keys(args).length) return `<div class="kv" style="font-size:11.5px"><span class="m">(no arguments)</span></div>`;
  const hits = fromPrev(args, priorOut);
  const rows = Object.entries(args).map(([k,v]) => {
    const src = hits[k];
    const tag = src ? `<span class="fromprev">↑ from ${esc(src.name)}${src.step?` (step ${src.step})`:""}</span>` : "";
    return `<div><b style="color:var(--violet)">${esc(k)}</b> = ${esc(JSON.stringify(v))}${tag}</div>`;
  });
  return `<div class="kv" style="flex-direction:column;gap:5px;font-size:11.5px">${rows.join("")}</div>`;
}

function roundTrip(tc, tool, priorOut){
  const rt = el("div","rt");
  const dur = tool && tool.duration_s!=null ? `<span class="dur">${tool.duration_s}s</span>` : "";
  rt.innerHTML = `<div class="rt-name">${IC.wrench} ${esc(tc.name||"tool")}
    ${dur}${tc.id?`<span class="idpill">${esc(String(tc.id).slice(0,22))}</span>`:""}</div>`;

  const m = el("div","rt-step model");
  m.innerHTML = `<div class="lab"><span class="mk">①</span> arguments the model generated</div>` +
    argsTable(tc.args, priorOut);
  rt.appendChild(m);

  rt.appendChild(Object.assign(el("div","rt-arrow"), {textContent:"↓"}));

  const r = el("div","rt-step run");
  r.innerHTML = `<div class="lab"><span class="mk">②</span> your app runs <code>${esc(tc.name||"tool")}</code></div>`;
  rt.appendChild(r);

  rt.appendChild(Object.assign(el("div","rt-arrow"), {textContent:"↓"}));

  if (!tool){
    const p = el("div","rt-step res");
    p.innerHTML = `<div class="lab"><span class="mk">③</span> result</div><div class="pending">⏳ not executed yet…</div>`;
    rt.appendChild(p);
    return rt;
  }
  const res = el("div","rt-step res" + (tool.error?" bad":""));
  res.innerHTML = `<div class="lab"><span class="mk">③</span> ${tool.error?"tool errored":"result handed back to the model"}</div>` +
    codeBlock(tool.error != null ? tool.error : tool.output);
  rt.appendChild(res);
  return rt;
}

function orphanTool(s){
  const turn = el("div","turn");
  turn.innerHTML = `<div class="turn-label">${IC.result}<span class="who">Tool run</span>
    <span class="model" style="margin-left:auto">${esc(s.name||"tool")}${s.duration_s!=null?` · ${s.duration_s}s`:""}</span></div>`;
  const rt = el("div","rt");
  rt.innerHTML = `<div class="rt-name">${IC.wrench} ${esc(s.name||"tool")}</div>`;
  const a = el("div","rt-step model");
  a.innerHTML = `<div class="lab"><span class="mk">in</span> input</div>` + codeBlock(s.input);
  const o = el("div","rt-step res"+(s.error?" bad":""));
  o.innerHTML = `<div class="lab"><span class="mk">out</span> ${s.error?"error":"output"}</div>` + codeBlock(s.error??s.output);
  rt.append(a,o); turn.appendChild(rt); return turn;
}

/* ---------- the run, as numbered steps ---------- */
/* `feed` is the container to fill; `d` is a trace document as written by
   src/utils/telemetry.py. Options: {primer:true} prepends the explainer,
   {question:true} prepends the user's query bubble. */
function renderConversationInto(feed, d, opts={}){
  if (opts.primer !== false) feed.appendChild(primer());

  if (opts.question !== false){
    const u = el("div","turn");
    u.innerHTML = `<div class="turn-label">${IC.msg}<span class="who">You asked</span><span>${clock(d.started_at)}</span></div>`;
    u.appendChild(el("div","bubble", d.query || "(no query)"));
    feed.appendChild(u);
  }

  const spans = d.spans || [];
  const toolById = {}, toolQ = {};
  spans.forEach(s => { if (s.type === "tool"){
    if (s.tool_call_id) toolById[s.tool_call_id] = s;
    (toolQ[s.name] = toolQ[s.name] || []).push(s);
  }});
  const used = new Set();
  const priorOut = [];   // [{step, name, json}] for every tool output seen so far
  let step = 0;

  spans.forEach(s => {
    if (s.type === "tool"){
      if (used.has(s)) return;              // already shown inside its LLM step
      feed.appendChild(orphanTool(s));      // safety net: unmatched tool run
      if (s.output != null) priorOut.push({step, name:s.name, json:JSON.stringify(s.output)});
      return;
    }
    step++;
    const out = s.output || {}, txt = textOf(out.text), tcs = out.tool_calls || [];
    const turn = el("div","turn");
    turn.appendChild(stepHeader(step, s, txt, tcs));

    if (s.error){ turn.appendChild(card("err","LLM error",{open:true,bodyHTML:codeBlock(s.error)})); }
    else {
      if (txt.trim())
        turn.appendChild(card("text","What the model said",{open:true,bodyHTML:`<div class="msgtext">${mdInline(txt)}</div>`}));

      if (tcs.length){
        turn.appendChild(callout(
          `The model can't run tools itself. It wrote <b>${tcs.length===1?"one request":tcs.length+" requests"}</b> ` +
          `(a tool name + arguments as JSON); your app runs ${tcs.length===1?"it":"them"} and feeds the result back.`));
        tcs.forEach(tc => {
          let tool = tc.id && toolById[tc.id];
          if (!tool){ const q = toolQ[tc.name] || []; tool = q.find(x => !used.has(x)); }
          if (tool) used.add(tool);
          turn.appendChild(roundTrip(tc, tool, priorOut));
          if (tool && tool.output != null) priorOut.push({step, name:tc.name, json:JSON.stringify(tool.output)});
        });
      }
      turn.appendChild(telemBlock(s));
    }
    feed.appendChild(turn);
  });
  return feed;
}

/* The metadata line above a run: mode/model chips, call counts, tokens, cost. */
function traceMetaline(d){
  const t = d.totals || {};
  return `<div class="metaline">
      ${modeModelChips(d.mode, d.models)}
      ${d.session_id?`<span class="chip">sess ${esc(String(d.session_id).slice(0,12))}</span>`:""}
      <span>·</span><span>${t.llm_calls||0} LLM · ${t.tool_calls||0} tool</span>
      <span>·</span><span>${fmt(t.input_tokens)} in / ${fmt(t.output_tokens)} out${t.cache_read_tokens?` / ${fmt(t.cache_read_tokens)} cache`:""}</span>
      ${t.est_cost_usd?`<span>·</span><span>$${t.est_cost_usd.toFixed(4)}</span>`:""}
      <span>·</span><span>${d.ended_at? (t.duration_s??"?")+"s" : "running…"}</span>
      ${d.error?`<span class="chip bad">trace error</span>`:""}
    </div>`;
}

/* Human-readable mode names, in the order the story goes:
   teacher → student → student after distillation. */
const MODE_LABEL = {
  "claude": "Claude (teacher)",
  "raw-open-source": "Qwen (base)",
  "finetuned-open-source": "Qwen + LoRA",
};
const label = m => MODE_LABEL[m] || m;

let V = { view:"leaderboard", qi:0, filter:"" };

/* ---------- leaderboard ---------- */

/* Columns of the comparison table. `good` says which direction is better, so
   the best/worst cells can be tinted without hardcoding per-metric logic. */
const COLS = [
  {k:"runs",             t:"runs",        good:0,  f:v=>v},
  {k:"error_rate",       t:"errors",      good:-1, f:(v,a)=>`${a.errors} (${(v*100).toFixed(0)}%)`},
  {k:"llm_calls_mean",   t:"LLM / run",   good:-1, f:v=>v},
  {k:"tool_calls_mean",  t:"tools / run", good:-1, f:v=>v},
  {k:"tokens_per_run",   t:"tokens / run",good:-1, f:v=>fmt(v)},
  {k:"output_tokens",    t:"output tok",  good:0,  f:v=>fmt(v)},
  {k:"latency_p50",      t:"p50 latency", good:-1, f:v=>v==null?"—":v+"s"},
  {k:"est_cost_usd",     t:"est. cost",   good:-1, f:v=>v==null?"—":"$"+v.toFixed(4)},
  {k:"grounded_search",  t:"grounded",    good:+1, f:v=>v==null?"—":(v*100).toFixed(0)+"%"},
  {k:"hit_neighborhood", t:"named area",  good:+1, f:v=>v==null?"—":(v*100).toFixed(0)+"%"},
];

function renderLeaderboard(){
  const main = $("#main"); main.innerHTML = "";
  const aggs = DATA.aggregates || [];
  if (!aggs.length){ main.innerHTML = `<div class="empty">No runs captured yet. Run <b>make compare-run</b>.</div>`; return; }

  const h2 = el("h2","sec","Leaderboard");
  const lede = el("div","lede");
  lede.innerHTML = `Every mode ran the same queries. <b>grounded</b> = resolved a location before searching; ` +
    `<b>named area</b> = the final answer mentions the query's target neighbourhood. Cost is estimated from ` +
    `list prices and only priced for Claude models.`;
  main.append(h2, lede);

  // best/worst per column, so a glance shows who wins each metric
  const extremes = {};
  COLS.forEach(c => {
    if (!c.good) return;
    const vals = aggs.map(a=>a[c.k]).filter(v=>v!=null);
    if (vals.length < 2) return;
    extremes[c.k] = {best: c.good>0?Math.max(...vals):Math.min(...vals),
                     worst: c.good>0?Math.min(...vals):Math.max(...vals)};
  });

  const wrap = el("div","lb-wrap");
  const rows = aggs.map(a => {
    const cells = COLS.map(c => {
      const v = a[c.k];
      const e = extremes[c.k];
      const cls = e && v!=null ? (v===e.best?" best":(v===e.worst?" worst":"")) : "";
      return `<td class="num${cls}">${v==null?"—":c.f(v,a)}</td>`;
    }).join("");
    return `<tr><td class="mode">${modeChip(a)}</td>${cells}</tr>`;
  }).join("");
  wrap.innerHTML = `<table class="lb">
    <thead><tr><th class="mode">mode</th>${COLS.map(c=>`<th>${esc(c.t)}</th>`).join("")}</tr></thead>
    <tbody>${rows}</tbody></table>`;
  main.appendChild(wrap);

  const h3 = el("h2","sec","Tool paths taken");
  const lede2 = el("div","lede");
  lede2.innerHTML = `The sequence of tools each run actually called, most common first. A fine-tuned model that ` +
    `learned the loop should converge on the teacher's shape.`;
  main.append(h3, lede2);

  const cols = el("div","cols");
  aggs.forEach(a => {
    const c = el("div","col");
    const total = a.runs || 1;
    const paths = Object.entries(a.tool_paths||{}).map(([sig,n]) =>
      `<div class="pathrow"><span class="sig" title="${esc(sig)}">${esc(sig)}</span>
        <span class="n">${n} · ${(n/total*100).toFixed(0)}%</span></div>`).join("");
    c.innerHTML = `<div class="col-head"><div class="chips">${modeChip(a)}</div></div>
      <div class="col-body"><div class="pathlist">${paths||'<span class="missing">no runs</span>'}</div></div>`;
    cols.appendChild(c);
  });
  main.appendChild(cols);
}

function modeChip(a){
  return `<span class="chip mode">${esc(label(a.mode))}</span>` +
    (a.models||[]).map(m=>`<span class="chip model">${esc(m)}</span>`).join("");
}

/* ---------- side by side ---------- */

function visibleQueries(){
  const f = V.filter.trim().toLowerCase();
  if (!f) return DATA.queries;
  return DATA.queries.filter(q => (q.query||"").toLowerCase().includes(f) || (q.id||"").includes(f));
}

function renderQueries(){
  const main = $("#main"); main.innerHTML = "";
  const list = visibleQueries();
  if (!DATA.queries.length){ main.innerHTML = `<div class="empty">No runs captured yet. Run <b>make compare-run</b>.</div>`; return; }

  const picker = el("div","picker");
  const sel = el("select");
  list.forEach((q,i) => {
    const o = el("option", null, `${q.id} — ${q.query || "(no query text)"}`);
    o.value = String(i);
    sel.appendChild(o);
  });
  if (V.qi >= list.length) V.qi = 0;
  sel.value = String(V.qi);
  sel.onchange = () => { V.qi = Number(sel.value); renderQueries(); };

  const search = el("input","search");
  search.placeholder = "filter queries…";
  search.value = V.filter;
  search.oninput = () => { V.filter = search.value; V.qi = 0; renderQueries(); };

  const nav = el("div","pills");
  const prev = el("button","pill","‹ prev"), next = el("button","pill","next ›");
  prev.onclick = () => { V.qi = (V.qi - 1 + list.length) % list.length; renderQueries(); };
  next.onclick = () => { V.qi = (V.qi + 1) % list.length; renderQueries(); };
  nav.append(prev,next);

  picker.append(sel, search, nav, el("span","stamp", `${list.length} / ${DATA.queries.length} queries`));
  main.appendChild(picker);

  if (!list.length){ main.appendChild(el("div","empty","No query matches that filter.")); return; }
  const q = list[V.qi];

  const head = el("div");
  head.innerHTML = `<h2 class="sec" style="margin-top:6px">${esc(q.query || "(no query text)")}</h2>`;
  const targets = el("div","targets");
  targets.innerHTML = `<span class="chip">id ${esc(q.id)}</span>` +
    (q.target_neighborhood?`<span class="chip">area · ${esc(q.target_neighborhood)}</span>`:"") +
    (q.target_cuisine?`<span class="chip">cuisine · ${esc(q.target_cuisine)}</span>`:"") +
    (q.target_vibe?`<span class="chip">vibe · ${esc(q.target_vibe)}</span>`:"");
  main.append(head, targets);

  // A tool step is highlighted when the modes disagree at that position.
  const paths = DATA.modes.map(m => (q.results[m]||{}).tool_path || []);
  const divergent = i => new Set(paths.filter(p=>p.length>i).map(p=>p[i])).size > 1;

  const cols = el("div","cols");
  DATA.modes.forEach(mode => cols.appendChild(resultColumn(mode, q.results[mode], divergent)));
  main.appendChild(cols);
}

function resultColumn(mode, r, divergent){
  const c = el("div","col");
  const head = el("div","col-head");
  head.innerHTML = `<div class="chips"><span class="chip mode">${esc(label(mode))}</span>` +
    (r && r.model?`<span class="chip model">${esc(r.model)}</span>`:"") + `</div>`;
  c.appendChild(head);

  const body = el("div","col-body");
  if (!r){
    body.innerHTML = `<div class="missing">This mode has no run for this query.</div>`;
    c.appendChild(body); return c;
  }

  head.insertAdjacentHTML("beforeend", `<div class="pathchain">${
    (r.tool_path||[]).map((n,i)=>`<span class="step${divergent(i)?" diff":""}">${esc(n)}</span>`).join('<span class="arr">→</span>')
    || '<span class="missing">no tools called</span>'}</div>`);

  if (r.error) body.innerHTML = `<div class="errbox">${esc(r.error)}</div>`;
  else if (r.answer) body.innerHTML = `<div class="answer">${mdInline(r.answer)}</div>`;
  else body.innerHTML = `<div class="missing">No final answer was produced.</div>`;

  const t = r.totals || {};
  const stat = el("div","statline");
  stat.innerHTML =
    `<span><b>${t.llm_calls??"—"}</b> LLM</span>` +
    `<span><b>${t.tool_calls??(r.tool_path||[]).length}</b> tools</span>` +
    `<span><b>${fmt(t.input_tokens)}</b> in</span>` +
    `<span><b>${fmt(t.output_tokens)}</b> out</span>` +
    (t.cache_read_tokens?`<span><b>${fmt(t.cache_read_tokens)}</b> cache</span>`:"") +
    (r.latency_s!=null?`<span><b>${r.latency_s}</b>s</span>`:"") +
    (t.est_cost_usd?`<span><b>$${t.est_cost_usd.toFixed(4)}</b></span>`:"");
  body.appendChild(stat);

  const flags = el("div","flags");
  flags.innerHTML = [
    flagHTML("grounded", r.grounded_search),
    flagHTML("named area", r.hit_neighborhood),
    flagHTML("named cuisine", r.hit_cuisine),
  ].join("");
  body.appendChild(flags);

  if (r.trace){
    const d = el("details","drill");
    d.innerHTML = `<summary>${IC.eye} full trace — ${(r.trace.spans||[]).length} spans</summary>`;
    // Built once, on first open: a run is a lot of DOM.
    d.addEventListener("toggle", () => {
      if (!d.open || d.dataset.built) return;
      d.dataset.built = "1";
      d.appendChild(renderConversationInto(el("div","feed"), r.trace, {primer:false, question:false}));
    });
    body.appendChild(d);
  }

  c.appendChild(body);
  return c;
}

function flagHTML(name, v){
  if (v == null) return `<span class="flag">${esc(name)} n/a</span>`;
  return `<span class="flag ${v?"ok":"no"}">${v?"✓":"✗"} ${esc(name)}</span>`;
}

/* ---------- boot ---------- */
function render(){
  [...$("#viewToggle").children].forEach(b=>b.classList.toggle("on", b.dataset.view===V.view));
  V.view === "leaderboard" ? renderLeaderboard() : renderQueries();
}
$("#viewToggle").onclick = e => { const b=e.target.closest(".pill"); if(!b) return; V.view=b.dataset.view; render(); };

if (DATA){
  $("#stamp").textContent = `${DATA.queries.length} queries · ${DATA.modes.length} modes · generated ${new Date(DATA.generated_at).toLocaleString()}`;
  render();
} else {
  $("#main").innerHTML = `<div class="empty">No data was inlined into this file. Rebuild it with <b>make compare</b>.</div>`;
}
</script>
</body>
</html>
