[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "anything-finder"
version = "0.1.0"
description = "Agentic search for convenience that aims to support local businesses"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.13.5",
    "fastapi>=0.136.3",
    "uvicorn>=0.48.0",
    "httpx>=0.28.0",
    "opentelemetry-instrumentation-fastapi>=0.63b1",
    "opentelemetry-distro>=0.63b1",
    "pydantic>=2.13.4",
    "annotated-doc>=0.0.4",
    "langgraph>=1.2.4",
    "langchain>=1.3.4",
    "langchain-core>=1.4.1",
    "langchain-openai>=1.2.2",
    "deepagents>=0.6.8",
    "polars>=1.41.2",
    "langgraph-checkpoint-postgres>=3.1.0",
    "psycopg[binary,pool]>=3.3.0",
    "langchain-anthropic>=1.7.0",
]

[tool.pyright]
typeCheckingMode = "basic"
reportArgumentType = false
reportGeneralTypeIssues = false

[tool.pycodestyle]
ignore = ["E", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-m 'not live'"
markers = [
    "live: tests that require a real vLLM endpoint and/or Postgres (opt-in)",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-httpx>=0.36.2",
    "pyyaml>=6.0",
]

# Fine-tuning stack. Heavy + GPU-oriented; kept out of the container
# (`containerfile` runs `uv sync --frozen --no-dev`) and installed on the brev.dev
# box with `uv sync --group training`. See scripts/train_lora.py + configs/lora/.
#
# torch is pinned to a CUDA 12.1 build (below) rather than the PyPI default,
# because PyPI's unadorned `torch` wheel now bundles CUDA 13 runtime libs
# (nvidia-cublas-13.x etc.) which plenty of brev.dev / cloud GPU images can't
# run — their driver reports "CUDA Version: 12.2" (`nvidia-smi`), i.e. driver
# 535.x, which only supports CUDA <= 12.2 runtimes. cu121 wheels are backward
# compatible with that driver; cu13 wheels are not. If your box's driver is
# newer (`nvidia-smi` shows CUDA Version >= 12.4), you can drop the pin.
training = [
    "torch>=2.4,<2.6",
    # Listed explicitly (vllm also pulls these transitively) so the
    # tool.uv.sources index pin below actually applies to them — a source
    # override only takes effect for a package that's a direct dependency
    # of this project, not a transitive one pulled in by vllm itself.
    "torchvision>=0.19,<0.21",
    "torchaudio>=2.4,<2.6",
    # vllm 0.7.3 (below) predates transformers' v5 breaking changes
    # (ProcessorMixin import rework) — cap it to the last v4 line.
    "transformers>=4.45,<5",
    "peft",
    "trl",
    "datasets",
    "accelerate",
    "bitsandbytes",
    "sentencepiece",
    "tensorboard",
    "pyyaml",
    "huggingface-hub",
    "vllm",
]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchvision = { index = "pytorch-cu121" }
torchaudio = { index = "pytorch-cu121" }
