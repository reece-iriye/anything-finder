[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "anything-finder"
version = "0.1.0"
description = "Agentic search for convenience that aims to support local businesses"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.13.5",
    "fastapi>=0.136.3",
    "uvicorn>=0.48.0",
    "httpx>=0.28.0",
    "opentelemetry-instrumentation-fastapi>=0.63b1",
    "opentelemetry-distro>=0.63b1",
    "pydantic>=2.13.4",
    "annotated-doc>=0.0.4",
    "langgraph>=1.2.4",
    "langchain>=1.3.4",
    "langchain-core>=1.4.1",
    "langchain-openai>=1.2.2",
    "deepagents>=0.6.8",
    "polars>=1.41.2",
    "langgraph-checkpoint-postgres>=3.1.0",
    "psycopg[binary,pool]>=3.3.0"
]

[tool.pyright]
typeCheckingMode = "basic"
reportArgumentType = false
reportGeneralTypeIssues = false

[tool.pycodestyle]
ignore = ["E", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-m 'not live'"
markers = [
    "live: tests that require a real vLLM endpoint and/or Postgres (opt-in)",
]